packages:
  - packages/*
  - packages/*/benchmark
  - internal-packages/*
  - examples
  - examples/*
  - scripts

allowBuilds:
  '@swc/core': true
  esbuild: true
  playwright-chromium: true

catalogs:
  default:
    '@oxc-node/core': ^1.0.1
    '@oxc-node/cli': ^1.0.1
    '@rollup/plugin-swc': ^0.4.1
    '@swc/core': ^1.16.22
    '@swc/plugin-emotion': ^20.0.2
    '@swc/plugin-react-remove-properties': ^18.0.2
    '@swc/plugin-styled-jsx': ^20.0.2
    '@swc/plugin-transform-imports': ^18.0.2
    rolldown: ^1.3.2
    vite: ^8.3.8
  babel7:
    '@babel/core': ^7.29.13
    '@babel/plugin-transform-runtime': ^7.29.7
    '@babel/runtime': ^7.29.13

patchedDependencies:
  '@emotion/babel-plugin@11.13.5': patches/@emotion__babel-plugin@11.13.5.patch
  styled-jsx@5.1.7: patches/styled-jsx@5.1.7.patch
