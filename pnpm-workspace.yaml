packages:
  - packages/*
  - packages/*/benchmark
  - internal-packages/*
  - examples
  - examples/*
  - scripts

allowBuilds:
  '@swc/core': true
  esbuild: true
  playwright-chromium: true

catalogs:
  default:
    '@oxc-node/core': ^0.1.7
    '@oxc-node/cli': ^0.1.7
    '@rollup/plugin-swc': ^0.4.1
    '@swc/core': ^1.16.20
    '@swc/plugin-emotion': ^19.0.0
    '@swc/plugin-react-remove-properties': ^17.0.0
    '@swc/plugin-styled-jsx': ^19.0.0
    '@swc/plugin-transform-imports': ^17.0.0
    rolldown: ^1.2.15
    vite: ^8.3.5
  babel7:
    '@babel/core': ^7.29.7
    '@babel/plugin-transform-runtime': ^7.29.7
    '@babel/runtime': ^7.29.10

patchedDependencies:
  '@emotion/babel-plugin@11.13.5': patches/@emotion__babel-plugin@11.13.5.patch
  styled-jsx@5.1.7: patches/styled-jsx@5.1.7.patch
